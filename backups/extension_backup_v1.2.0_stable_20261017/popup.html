<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Film Partisi</title>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --bg-ambient: #090b12;
      --glass-panel: rgba(18, 21, 33, 0.78);
      --glass-panel-border: rgba(255, 255, 255, 0.14);
      --glass-surface: rgba(255, 255, 255, 0.06);
      --glass-surface-hover: rgba(255, 255, 255, 0.10);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-hover: rgba(255, 255, 255, 0.24);
      --primary-red: #e50914;
      --primary-gradient: linear-gradient(135deg, #e50914 0%, #ff3838 100%);
      --accent-green: #2ed573;
      --accent-green-gradient: linear-gradient(135deg, #2ed573 0%, #20bf6b 100%);
      --text-bright: #ffffff;
      --text-primary: #e6e8ee;
      --text-secondary: rgba(255, 255, 255, 0.65);
      --text-muted: rgba(255, 255, 255, 0.45);
      --shadow-elevation: 0 20px 48px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      background: #090b12;
      color: var(--text-primary);
      overflow-x: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body::before {
      content: '';
      position: fixed;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 150px;
      background: radial-gradient(ellipse, rgba(229, 9, 20, 0.25) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(28px);
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(18, 21, 33, 0.78);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-panel-border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow-elevation);
      display: flex;
      flex-direction: column;
      gap: 11px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* Header */
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 11px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    }

    .logo-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 4px 14px rgba(229, 9, 20, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      object-fit: cover;
    }

    .logo-title-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    h1 {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-bright);
      letter-spacing: -0.4px;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 3px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    h1 span.logo-dot {
      color: var(--primary-red);
      text-shadow: 0 0 8px rgba(229, 9, 20, 0.6);
    }

    .version-tag {
      font-size: 9.5px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text-secondary);
      padding: 2px 5px;
      border-radius: 6px;
      letter-spacing: 0.2px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .status-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .status-dot.active {
      background-color: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green), 0 0 20px rgba(46, 213, 115, 0.4);
      animation: fsStatusPulse 2s infinite ease-in-out;
    }

    @keyframes fsStatusPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.15); }
    }

    /* Kullanıcı Bilgisi - 2026 Frosted Glass */
    .user-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 12px;
      padding: 5px 11px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 2px 8px rgba(0, 0, 0, 0.2);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .user-input-wrapper:hover {
      background: var(--glass-surface-hover);
      border-color: var(--glass-border-hover);
    }

    .user-input-wrapper:focus-within {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(229, 9, 20, 0.5);
      box-shadow: 0 0 14px rgba(229, 9, 20, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .user-avatar-badge {
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    .user-avatar-badge:hover { transform: scale(1.25) rotate(5deg); }
    .user-avatar-badge:active { transform: scale(1.1); }

    .username-input {
      flex: 1;
      background: transparent !important;
      border: none !important;
      color: var(--text-bright);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 0;
      outline: none !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .username-input::placeholder {
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Bölüm Başlıkları */
    .section-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .badge-count {
      font-size: 10.5px;
      font-weight: 700;
      background: rgba(46, 213, 115, 0.14);
      color: var(--accent-green);
      padding: 2px 8px;
      border-radius: 9999px;
      border: 1px solid rgba(46, 213, 115, 0.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Oda Koduyla Katıl Satırı */
    .join-code-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .join-code-input {
      flex: 1;
      background: var(--glass-surface) !important;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 12px;
      color: #ff4757;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
      padding: 7px 10px;
      outline: none;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .join-code-input:focus {
      background: rgba(255, 255, 255, 0.09) !important;
      border-color: rgba(229, 9, 20, 0.5);
      box-shadow: 0 0 14px rgba(229, 9, 20, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .join-code-input::placeholder {
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .btn-join-code {
      background: var(--accent-green-gradient);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      padding: 7px 14px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 14px rgba(46, 213, 115, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .btn-join-code:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 18px rgba(46, 213, 115, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .btn-join-code:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-join-code:focus-visible {
      outline: 2px solid rgba(46, 213, 115, 0.6);
      outline-offset: 2px;
    }

    /* Açık Odalar Konteyneri */
    #publicRoomList {
      max-height: 125px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-right: 3px;
    }

    #publicRoomList::-webkit-scrollbar { width: 3px; }
    #publicRoomList::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.20); border-radius: 2px; }

    .public-room-card {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 12px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .public-room-card:hover {
      background: var(--glass-surface-hover);
      border-color: rgba(229, 9, 20, 0.4);
      transform: translateY(-1.5px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .public-room-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .public-room-code-badge {
      font-size: 13px;
      font-weight: 800;
      color: #ff4757;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .room-code-pill {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      color: #ff4757;
      letter-spacing: 1.5px;
      background: rgba(229, 9, 20, 0.14);
      border: 1px solid rgba(229, 9, 20, 0.30);
      border-radius: 10px;
      padding: 2px 8px;
      backdrop-filter: blur(10px) saturate(180%);
      -webkit-backdrop-filter: blur(10px) saturate(180%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .public-room-platform {
      font-size: 10.5px;
      color: var(--text-secondary);
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .public-room-users {
      font-size: 11px;
      color: var(--accent-green);
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .btn-join-public {
      background: var(--primary-gradient);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      box-shadow: 0 2px 8px rgba(229, 9, 20, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .btn-join-public:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 14px rgba(229, 9, 20, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .btn-join-public:active {
      transform: scale(0.97);
    }

    .btn-join-public:focus-visible {
      outline: 2px solid rgba(229, 9, 20, 0.6);
      outline-offset: 1px;
    }

    .btn-delete-public {
      background: rgba(229, 9, 20, 0.14);
      color: #ff4d4d;
      border: 1px solid rgba(229, 9, 20, 0.28);
      border-radius: 10px;
      padding: 4px 7px;
      font-size: 11px;
      cursor: pointer;
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      line-height: 1;
    }

    .btn-delete-public:hover {
      background: rgba(229, 9, 20, 0.28);
      border-color: rgba(229, 9, 20, 0.5);
      transform: scale(1.08);
    }

    .btn-delete-public:active {
      transform: scale(0.95);
    }

    .btn-delete-public:focus-visible {
      outline: 2px solid rgba(229, 9, 20, 0.6);
      outline-offset: 1px;
    }

    .empty-room-msg {
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      padding: 10px 12px;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    /* Servis Kartları Grid - 2026 Frosted Glass Bento */
    .platform-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .platform-card {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 12px;
      padding: 9px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .platform-card:hover {
      background: var(--glass-surface-hover);
      border-color: rgba(229, 9, 20, 0.45);
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 18px rgba(229, 9, 20, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    .platform-card:active {
      transform: translateY(0) scale(0.97);
    }

    .platform-card:focus-visible {
      outline: 2px solid rgba(229, 9, 20, 0.5);
      outline-offset: 1px;
    }

    .platform-icon {
      font-size: 19px;
      margin-bottom: 2px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }
    .platform-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-bright);
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    /* Parti Başlat Butonu */
    .btn-start-party {
      width: 100%;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 12px;
      background: var(--primary-gradient);
      color: #fff;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(229, 9, 20, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      letter-spacing: 0.3px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .btn-start-party:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 6px 24px rgba(229, 9, 20, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .btn-start-party:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-start-party:focus-visible {
      outline: 2px solid rgba(229, 9, 20, 0.6);
      outline-offset: 2px;
    }

    /* Switch - 2026 Frosted Glass */
    .switch-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 12px;
      padding: 7px 11px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .switch-text {
      font-size: 12px;
      color: var(--text-primary);
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.14);
      transition: .25s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
    }
    .slider:before {
      position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px;
      background-color: #bbb; transition: .25s cubic-bezier(0.16, 1, 0.3, 1); border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary-red); box-shadow: 0 0 10px rgba(229, 9, 20, 0.4); }
    input:checked + .slider:before { transform: translateX(16px); background-color: white; }

    /* Aktif Oda Kartı - 2026 Frosted Glass */
    .active-room-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 7px;
    }

    .active-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(46, 213, 115, 0.14);
      border: 1px solid rgba(46, 213, 115, 0.30);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--accent-green);
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 2px 8px rgba(46, 213, 115, 0.15);
    }

    .status-pulse-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent-green);
      animation: fsStatusPulse 1.8s infinite ease-in-out;
    }

    .room-id-display {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      margin: 2px 0 0 0;
      letter-spacing: 4px;
      cursor: pointer;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 13px;
      padding: 7px 16px;
      width: 100%;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 6px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .room-id-display:hover {
      background: var(--glass-surface-hover);
      border-color: rgba(229, 9, 20, 0.45);
      transform: scale(1.02);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 8px 24px rgba(229, 9, 20, 0.25);
    }

    .room-id-display:active {
      transform: scale(0.98);
    }

    .room-id-display:focus-visible {
      outline: 2px solid rgba(229, 9, 20, 0.6);
      outline-offset: 2px;
    }

    .room-id-hint {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: -3px;
    }

    .copied-toast {
      font-size: 11px;
      color: var(--accent-green);
      font-weight: 700;
      text-shadow: 0 0 8px rgba(46, 213, 115, 0.4);
    }

    .btn-go-movie {
      background: var(--primary-gradient) !important;
      border: 1px solid rgba(255, 255, 255, 0.28) !important;
      color: #fff !important;
      width: 100%;
      padding: 9px !important;
      font-size: 13px !important;
      font-weight: 800 !important;
      border-radius: 12px !important;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(229, 9, 20, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.28) !important;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      letter-spacing: 0.2px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .btn-go-movie:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 6px 24px rgba(229, 9, 20, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.35) !important;
    }

    .btn-go-movie:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-go-movie:focus-visible {
      outline: 2px solid rgba(229, 9, 20, 0.6);
      outline-offset: 2px;
    }

    .user-list-container {
      width: 100%;
      margin-top: 3px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
    }

    .user-list-items {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 4px;
    }

    .user-badge {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-radius: 12px;
      padding: 3px 9px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 600;
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .user-badge:hover {
      background: var(--glass-surface-hover);
      border-color: rgba(255, 255, 255, 0.20);
      transform: translateY(-1px);
    }

    .user-badge-online-dot {
      width: 5px;
      height: 5px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent-green);
    }

    .btn-secondary {
      background: var(--glass-surface);
      color: var(--text-bright);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      width: 100%;
      padding: 7px;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 11px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .btn-secondary:hover {
      background: var(--glass-surface-hover);
      border-color: rgba(255, 255, 255, 0.24);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-secondary:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }

    .btn-danger {
      background: rgba(229, 9, 20, 0.12);
      color: #ff4d4d;
      border: 1px solid rgba(229, 9, 20, 0.28);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      width: 100%;
      padding: 7px;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 11px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(229, 9, 20, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .btn-danger:hover {
      background: rgba(229, 9, 20, 0.25);
      border-color: rgba(229, 9, 20, 0.50);
      color: #ff6b6b;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(229, 9, 20, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .btn-danger:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-danger:focus-visible {
      outline: 2px solid rgba(229, 9, 20, 0.6);
      outline-offset: 2px;
    }

    .toast-popup {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 21, 33, 0.88);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-bright);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      display: none;
      z-index: 1000;
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Üst Başlık & Logo -->
    <div class="logo-container">
      <div class="logo-brand">
        <img src="icon128.png" class="logo-img" alt="Film Partisi">
        <div class="logo-title-group">
          <h1>Film Partisi<span class="logo-dot">.</span></h1>
        </div>
      </div>
      <div class="status-badge" title="Bağlantı Durumu">
        <span class="status-dot" id="globalStatusDot"></span>
      </div>
    </div>

    <!-- Kullanıcı Adı & Profil Simgesi -->
    <div id="commonUserConfig" class="user-input-wrapper">
      <span id="userAvatarDisplay" class="user-avatar-badge" title="Profil simgesini değiştir">🍿</span>
      <input type="text" id="usernameInput" class="username-input" placeholder="Adınız">
    </div>

    <!-- Açık Odalar -->
    <div id="publicRoomsSection">
      <div class="section-title-row">
        <span class="section-title">Açık Odalar</span>
        <span id="publicRoomCountBadge" class="badge-count">0 Oda</span>
      </div>
      <div id="publicRoomList">
        <div class="empty-room-msg">Odalar taranıyor...</div>
      </div>
    </div>

    <!-- Oda Koduyla Katıl -->
    <div id="joinCodeSection" style="padding-top: 2px;">
      <div class="section-title-row">
        <span class="section-title">Oda Koduyla Katıl</span>
      </div>
      <div class="join-code-row">
        <input type="text" id="joinRoomCodeInput" class="join-code-input" placeholder="ABCD" maxlength="4">
        <button id="btnJoinWithCode" class="btn-join-code">Katıl</button>
      </div>
    </div>

    <!-- 1. Aktif Oda Kartı (Oda Açıkken Görünür) -->
    <div id="activeRoomContainer" class="active-room-card hidden">
      <div class="active-status-badge">
        <span class="status-pulse-dot"></span>
        <span>Oda Bağlantısı Aktif</span>
      </div>
      <div id="roomIdDisplay" class="room-id-display" title="Oda kodunu kopyalamak için tıklayın" role="button" tabindex="0">----</div>
      <div class="room-id-hint">Kopyalamak için tıklayın</div>
      <div class="copied-toast" id="copiedToast" style="display:none;">Kopyalandı</div>
      
      <button id="btnGoToMovie" class="btn-go-movie">Filme Git</button>

      <div class="user-list-container">
        <div class="section-title" id="userCountTitle">Katılımcılar (0)</div>
        <div class="user-list-items" id="activeUsersList"></div>
      </div>

      <button id="btnRetrySync" class="btn-secondary">Senkronize Et</button>
      <button id="btnCopyInvite" class="btn-secondary">Davet Bağlantısını Kopyala</button>
      <button id="btnLeaveRoom" class="btn-danger">Odadan Ayrıl</button>
    </div>

    <!-- 2. Parti Başlatma Kartı (Desteklenen film sayfasındayken) -->
    <div id="partyCreatorContainer" class="party-creator-panel hidden">
      <div class="switch-group">
        <span class="switch-text">Yalnızca ben kontrol edeyim</span>
        <label class="switch">
          <input type="checkbox" id="hostOnlySwitch">
          <span class="slider"></span>
        </label>
      </div>
      <button id="btnStartParty" class="btn-start-party">Parti Başlat</button>
    </div>

    <!-- 3. Servis Seçici (Henüz bir film sayfasında değilken) -->
    <div id="platformSelectorContainer" class="platform-selector-panel hidden">
      <div class="section-title-row">
        <span class="section-title">Platformlar</span>
      </div>
      <div class="platform-grid">
        <div class="platform-card" data-url="https://www.netflix.com">
          <span class="platform-icon">🍿</span>
          <span class="platform-name">Netflix</span>
        </div>
        <div class="platform-card" data-url="https://www.hdfilmcehennemi.com">
          <span class="platform-icon">🎬</span>
          <span class="platform-name">HDFilmCehennemi</span>
        </div>
        <div class="platform-card" data-url="https://t.ly/dizipalgiris">
          <span class="platform-icon">🎥</span>
          <span class="platform-name">Dizipal</span>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-popup" id="globalToast">İşlem başarılı</div>

  <!-- Firebase SDK Kütüphaneleri -->
  <script src="libs/firebase-app.js"></script>
  <script src="libs/firebase-database.js"></script>
  <script src="popup.js"></script>
</body>
</html>
